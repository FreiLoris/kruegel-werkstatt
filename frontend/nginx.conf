# nginx-Konfiguration für den Frontend-Container.
#   /api/*  → an das Backend weiterleiten
#   alles andere → die gebaute React-App ausliefern

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Backend ──────────────────────────────────────────────────
    # "backend" ist der Service-Name aus compose.yaml (Docker-internes DNS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Live-Updates (Server-Sent Events) ────────────────────────
    # Lange offene Verbindung: nginx darf nichts zwischenspeichern (sonst kommen
    # Nachrichten verzögert an) und die Verbindung nicht nach 60 s kappen.
    location = /api/live {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ── Statische Dateien ────────────────────────────────────────
    # Dateien in /assets haben einen Hash im Namen (z.B. index-C-ydMvHH.js)
    # → ändern sich nie → darf der Browser ein Jahr lang cachen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html dagegen nie cachen, damit Updates sofort ankommen.
    # try_files: unbekannte Pfade (z.B. /auftraege) liefern index.html,
    # damit das Routing im Browser funktioniert.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
