# nginx configuration for the frontend container.
#   /api/*  → forward to the backend
#   everything else → serve the built React app

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (SwissGarage Excel exports) – same limit as the backend (application.yaml)
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── Backend ──────────────────────────────────────────────────
    # "backend" is the service name from compose.yaml, asked from Docker's DNS every 10 s instead
    # of once at the start: Watchtower restarts the backend on its own (new address), and the
    # frontend also starts while the backend is not there yet (502 for a moment, no crash).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Live updates (Server-Sent Events) ────────────────────────
    # Long-lived connection: nginx must not buffer anything (otherwise messages
    # arrive late) and must not cut the connection after 60 s.
    location = /api/live {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # FB-22: the test page of the whiteboard, also without ".html" (as Reto typed it)
    location = /board-test {
        return 302 /board-test.html;
    }

    # ── Static files ─────────────────────────────────────────────
    # Files in /assets have a hash in their name (e.g. index-C-ydMvHH.js)
    # → never change → the browser may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html on the other hand is never cached, so updates arrive immediately.
    # try_files: unknown paths (e.g. /employees) return index.html,
    # so routing in the browser works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
