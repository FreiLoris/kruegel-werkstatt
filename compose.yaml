# Docker Compose for the workshop app: database, backend, frontend.
#
#   docker compose up -d --build    build and start everything → http://localhost:8090
#   docker compose up -d db         only the database (for development with a local backend)
#   docker compose down             stop (data stays in the volume)
#
# Configuration comes from the file .env (template: .env.example).
# Without .env the defaults after ":-" apply.
#
# Memory limits: the target NAS has 2 GB RAM, DSM itself needs a large part of it.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-werkstatt}
      POSTGRES_USER: ${DB_USER:-werkstatt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-werkstatt}
    ports:
      # Only reachable from this computer (127.0.0.1), not from the network.
      # Needed when the backend runs locally outside of Docker.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-werkstatt}
      DB_USER: ${DB_USER:-werkstatt}
      DB_PASSWORD: ${DB_PASSWORD:-werkstatt}
      # Java may use at most 60 % of the container limit as heap
      # (rest: metaspace, threads, ...). SerialGC needs the least memory.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
    # No "ports": the backend is only reachable internally – from outside everything goes through nginx.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 400m

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    mem_limit: 64m

volumes:
  db-data:
