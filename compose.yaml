# Docker Compose for the workshop app: database, backend, frontend.
#
#   docker compose up -d --build    build and start everything → http://localhost:8090
#   docker compose up -d db         only the database (for development with a local backend)
#   docker compose down             stop (data stays in the volume)
#   docker compose exec backup sh /backup/backup.sh    back up right now (see docs/operations.md)
#
# Configuration comes from the file .env (template: .env.example).
# Without .env the defaults after ":-" apply.
#
# Memory limits: the target NAS has 2 GB RAM, DSM itself needs a large part of it.
#
# The image names are those in the GitHub Container Registry: CI builds and pushes them as "dev"
# after every merge, the installed instances only pull them (deploy/compose.yaml – keep both files
# in step).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-werkstatt}
      POSTGRES_USER: ${DB_USER:-werkstatt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-werkstatt}
    ports:
      # Only reachable from this computer (127.0.0.1), not from the network.
      # Needed when the backend runs locally outside of Docker.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  backend:
    build: ./backend
    image: ghcr.io/freiloris/kruegel-werkstatt-backend:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # it prepares the folder for the backup before an update
      backup:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-werkstatt}
      DB_USER: ${DB_USER:-werkstatt}
      DB_PASSWORD: ${DB_PASSWORD:-werkstatt}
      # Java may use at most 50 % of the container limit as heap (256 MB). The rest is for
      # metaspace, code cache and threads – measured at about 150 MB after phase 12, which left
      # no room under the old limit (400 MB, 60 %: peak 397 MB). SerialGC needs the least memory.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC
      # an update with a database change backs it up first (prepared by the backup container)
      BACKUP_BEFORE_MIGRATION_DIR: /dumps/vor-update
    volumes:
      - ${BACKUP_DIR:-./Datensicherung}:/dumps
    # No "ports": the backend is only reachable internally – from outside everything goes through nginx.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    mem_limit: 512m

  frontend:
    build: ./frontend
    image: ghcr.io/freiloris/kruegel-werkstatt-frontend:dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    mem_limit: 64m

  # Nightly database backup into BACKUP_DIR (NAS: Datensicherung), old ones deleted after
  # BACKUP_KEEP_DAYS. Restore: docs/operations.md
  backup:
    build: ./backup
    image: ghcr.io/freiloris/kruegel-werkstatt-backup:dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-werkstatt}
      PGUSER: ${DB_USER:-werkstatt}
      PGPASSWORD: ${DB_PASSWORD:-werkstatt}
      TZ: Europe/Zurich
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:-./Datensicherung}:/dumps
    mem_limit: 64m

volumes:
  db-data:
