# CI: checks on every pull request and every push to main
# whether backend, frontend and Docker images build cleanly.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request cancels the old run that is still going. Not on main: a cancelled
# push would leave "dev" half new, half old.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # "verify" compiles, runs all tests (Testcontainers uses the
      # GitHub runner's Docker) and builds the JAR.
      - name: Build & Test
        run: ./mvnw -B verify

      # The tests rewrite api/openapi.json. If it differs from the committed
      # file, the API was changed without delivering the contract.
      - name: API contract up to date?
        run: |
          git diff --exit-code ../api/openapi.json || {
            echo "::error::api/openapi.json is outdated. Run './mvnw test' locally and commit the file."
            exit 1
          }

  frontend:
    name: Frontend (lint, tests & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate the types from api/openapi.json again – they must match the committed file.
      - name: API types up to date?
        run: |
          npm run api:generate
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is outdated. Run 'npm run api:generate' locally and commit the file."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (incl. type check)
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    # writing to the GitHub Container Registry (only used on main)
    permissions:
      contents: read
      packages: write
    # Only when code and tests are ok – saves time on errors.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build

      # The instance file must stay valid with both channels (it is not used anywhere else in CI)
      - name: Instance compose file valid?
        run: |
          docker compose -f deploy/compose.yaml --env-file deploy/release.env.example config --quiet
          docker compose -f deploy/compose.yaml --env-file deploy/dev.env.example config --quiet

      # Only after a merge to main: "dev" for the test instances (deploy/dev.env.example), plus the
      # commit as a tag – to go back to an exact version. "latest" for the NAS only comes with a
      # release (release.yml), which tags these very images.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose push
          for name in backend frontend backup; do
            image="ghcr.io/freiloris/kruegel-werkstatt-${name}"
            docker tag "${image}:dev" "${image}:${GITHUB_SHA::7}"
            docker push "${image}:${GITHUB_SHA::7}"
          done
