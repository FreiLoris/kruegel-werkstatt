# CI: checks on every pull request and every push to main
# whether backend, frontend and Docker images build cleanly.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the old run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # "verify" compiles, runs all tests (Testcontainers uses the
      # GitHub runner's Docker) and builds the JAR.
      - name: Build & Test
        run: ./mvnw -B verify

      # The tests rewrite api/openapi.json. If it differs from the committed
      # file, the API was changed without delivering the contract.
      - name: API contract up to date?
        run: |
          git diff --exit-code ../api/openapi.json || {
            echo "::error::api/openapi.json is outdated. Run './mvnw test' locally and commit the file."
            exit 1
          }

  frontend:
    name: Frontend (lint, tests & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Generate the types from api/openapi.json again – they must match the committed file.
      - name: API types up to date?
        run: |
          npm run api:generate
          git diff --exit-code src/api/schema.d.ts || {
            echo "::error::src/api/schema.d.ts is outdated. Run 'npm run api:generate' locally and commit the file."
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build (incl. type check)
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    # Only when code and tests are ok – saves time on errors.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build
