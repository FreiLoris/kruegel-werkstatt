spring:
  application:
    name: werkstatt

  # Verbindung zur PostgreSQL-Datenbank.
  # Werte kommen aus Umgebungsvariablen, sonst gelten die Standardwerte
  # (passend zu compose.yaml für die lokale Entwicklung).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:werkstatt}
    username: ${DB_USER:werkstatt}
    password: ${DB_PASSWORD:werkstatt}

  # Flyway führt beim Start alle neuen Skripte aus src/main/resources/db/migration aus.
  flyway:
    locations: classpath:db/migration

  jpa:
    # Das Schema gehört Flyway. Hibernate prüft beim Start nur, ob Entitäten und
    # Tabellen zusammenpassen – und verweigert den Start, wenn nicht.
    hibernate:
      ddl-auto: validate
    # Keine Datenbankzugriffe mehr, nachdem der Controller fertig ist
    # (sonst entstehen unbemerkt langsame Nachlade-Abfragen beim JSON-Erzeugen).
    open-in-view: false
    properties:
      hibernate:
        # Zeitpunkte immer in UTC an die Datenbank übergeben.
        jdbc:
          time_zone: UTC

  # Die App ist nur deutschsprachig: Validierungsmeldungen ("darf nicht leer sein")
  # immer auf Deutsch, unabhängig von der Spracheinstellung des Browsers.
  web:
    locale: de
    locale-resolver: fixed

server:
  port: 8080

# OpenAPI-Beschreibung der API (springdoc).
#   /api/openapi    Beschreibung als JSON (daraus entstehen die Frontend-Typen)
#   /api/docs       Swagger UI – API im Browser ansehen und ausprobieren
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
  # Nur unsere API beschreiben (keine Test-Endpoints, kein Actuator)
  paths-to-match: /api/**
  # Stabile, gut lesbare Ausgabe → saubere Diffs im Pull Request
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# Actuator: Betriebs-Endpoints von Spring Boot.
# Wir veröffentlichen nur "health" und legen ihn unter /api,
# damit später alles Backend-seitige unter einem Pfad liegt (nginx leitet /api weiter).
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      # Keine Übersichtsseite aller Actuator-Endpoints unter /api
      discovery:
        enabled: false
  endpoint:
    health:
      # Internes Tool: Details (z.B. Datenbank-Status ab Schritt 1c) immer anzeigen.
      show-details: always
