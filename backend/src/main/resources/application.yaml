spring:
  application:
    # Product name (also used for the database and the Docker project) – stays German.
    name: werkstatt

  # Connection to the PostgreSQL database.
  # Values come from environment variables, otherwise the defaults apply
  # (matching compose.yaml for local development).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:werkstatt}
    username: ${DB_USER:werkstatt}
    password: ${DB_PASSWORD:werkstatt}

  # On startup Flyway runs all new scripts from src/main/resources/db/migration.
  flyway:
    locations: classpath:db/migration

  jpa:
    # The schema belongs to Flyway. On startup Hibernate only checks that entities and
    # tables match – and refuses to start if they do not.
    hibernate:
      ddl-auto: validate
    # No database access after the controller has finished
    # (otherwise slow lazy-loading queries sneak in while the JSON is written).
    open-in-view: false
    properties:
      hibernate:
        # No jdbc.time_zone: Instant is stored as UTC anyway (timestamptz), and the setting would
        # also shift LocalTime/LocalDateTime – Swiss wall-clock times – whenever the JVM does not
        # run in UTC (tests on a Swiss laptop: 08:00 stored as 07:00, constraints compared garbage).
        jdbc:
          # Send inserts/updates in groups of 50 instead of one by one – the SwissGarage
          # import writes thousands of rows (IDs are assigned in Java, so batching works).
          batch_size: 50
        order_inserts: true
        order_updates: true

  # Upload of the SwissGarage Excel exports (a few hundred KB; the default limit is 1 MB).
  # nginx has the same limit (frontend/nginx.conf: client_max_body_size).
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # The app is German only: validation messages ("darf nicht leer sein") are always German,
  # regardless of the browser's language setting.
  web:
    locale: de
    locale-resolver: fixed

server:
  port: 8080

# OpenAPI description of the API (springdoc).
#   /api/openapi    description as JSON (the frontend types are generated from it)
#   /api/docs       Swagger UI – view and try the API in the browser
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
  # Only describe our API (no test endpoints, no actuator)
  paths-to-match: /api/**
  # Stable, readable output → clean diffs in pull requests
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# Backup before an update with a database change (MigrationConfig): the folder for it; empty = none
# (tests, development). Installed instances set it in compose.yaml.
workshop:
  backup-before-migration-dir: ${BACKUP_BEFORE_MIGRATION_DIR:}
  # SMS reminders by ASPSMS (17c): the workshop's access – only on the NAS; empty = SMS only logged.
  # The sender shown on the phone: up to 11 letters.
  aspsms:
    user-key: ${ASPSMS_USERKEY:}
    password: ${ASPSMS_PASSWORD:}
    originator: ${ASPSMS_ORIGINATOR:Kruegel}
  # Which version runs (compose.yaml): "dev" = a test instance – it sends no SMS
  app-version: ${APP_VERSION:}

# Actuator: operational endpoints of Spring Boot.
# We only publish "health" and put it under /api,
# so everything backend-related lives under one path (nginx forwards /api).
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      # No overview page of all actuator endpoints under /api
      discovery:
        enabled: false
  endpoint:
    health:
      # Internal tool: always show details (e.g. database status).
      show-details: always

# Hibernate logs every constraint violation with PostgreSQL's detail "Failing row contains (…)" –
# the whole row, e.g. a customer's name and phone number. GlobalExceptionHandler logs the constraint
# name instead; real SQL errors still reach the log as exceptions.
logging:
  level:
    org.hibernate.orm.jdbc.error: error
