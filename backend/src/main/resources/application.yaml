spring:
  application:
    # Product name (also used for the database and the Docker project) – stays German.
    name: werkstatt

  # Connection to the PostgreSQL database.
  # Values come from environment variables, otherwise the defaults apply
  # (matching compose.yaml for local development).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:werkstatt}
    username: ${DB_USER:werkstatt}
    password: ${DB_PASSWORD:werkstatt}

  # On startup Flyway runs all new scripts from src/main/resources/db/migration.
  flyway:
    locations: classpath:db/migration

  jpa:
    # The schema belongs to Flyway. On startup Hibernate only checks that entities and
    # tables match – and refuses to start if they do not.
    hibernate:
      ddl-auto: validate
    # No database access after the controller has finished
    # (otherwise slow lazy-loading queries sneak in while the JSON is written).
    open-in-view: false
    properties:
      hibernate:
        # Always pass points in time to the database in UTC.
        jdbc:
          time_zone: UTC

  # The app is German only: validation messages ("darf nicht leer sein") are always German,
  # regardless of the browser's language setting.
  web:
    locale: de
    locale-resolver: fixed

server:
  port: 8080

# OpenAPI description of the API (springdoc).
#   /api/openapi    description as JSON (the frontend types are generated from it)
#   /api/docs       Swagger UI – view and try the API in the browser
springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
  # Only describe our API (no test endpoints, no actuator)
  paths-to-match: /api/**
  # Stable, readable output → clean diffs in pull requests
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true

# Actuator: operational endpoints of Spring Boot.
# We only publish "health" and put it under /api,
# so everything backend-related lives under one path (nginx forwards /api).
management:
  endpoints:
    web:
      base-path: /api
      exposure:
        include: health
      # No overview page of all actuator endpoints under /api
      discovery:
        enabled: false
  endpoint:
    health:
      # Internal tool: always show details (e.g. database status).
      show-details: always
