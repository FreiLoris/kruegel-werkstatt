# Adds to the main configuration (src/main/resources/application.yaml) ONLY in tests.
# Spring loads both files; values from here override the ones with the same name from there.

spring:
  flyway:
    # Additional migrations with tables that only exist for tests
    # (e.g. for the test entity in common.persistence).
    locations: classpath:db/migration, classpath:db/test-migration
