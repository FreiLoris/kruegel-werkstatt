# The workshop app as an installed instance – see docs/deployment-nas.md.
#
# Unlike the compose.yaml in the project root nothing is built here: the images come ready-made
# from the GitHub Container Registry. Keep the services in step with the root compose.yaml.
#
# One file for every instance, the channel comes from the .env next to it:
#   release.env.example  the NAS in the workshop – only released versions ("latest")
#   dev.env.example      Reto's and Loris' computers – every merge to main ("dev")
# Watchtower looks for a newer image of the channel and restarts the app with it by itself.
#
# Without a database password and a backup folder in .env it refuses to start instead of running
# with a default password.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-werkstatt}
      POSTGRES_USER: ${DB_USER:-werkstatt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
    # no "ports": the database is only reachable inside the project, never from the network
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  backend:
    image: ghcr.io/freiloris/kruegel-werkstatt-backend:${APP_VERSION:?APP_VERSION fehlt in .env}
    # "Erstellen"/"up" fetches the newest image of the channel
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
      # it prepares the folder for the backup before an update
      backup:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-werkstatt}
      DB_USER: ${DB_USER:-werkstatt}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC
      # an update with a database change backs it up first (prepared by the backup container)
      BACKUP_BEFORE_MIGRATION_DIR: /dumps/vor-update
    volumes:
      - ${BACKUP_DIR:?BACKUP_DIR fehlt in .env}:/dumps
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    mem_limit: 512m

  frontend:
    image: ghcr.io/freiloris/kruegel-werkstatt-frontend:${APP_VERSION:?APP_VERSION fehlt in .env}
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8090}:80"
    mem_limit: 64m

  backup:
    image: ghcr.io/freiloris/kruegel-werkstatt-backup:${APP_VERSION:?APP_VERSION fehlt in .env}
    pull_policy: always
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${DB_NAME:-werkstatt}
      PGUSER: ${DB_USER:-werkstatt}
      PGPASSWORD: ${DB_PASSWORD:?DB_PASSWORD fehlt in .env}
      TZ: Europe/Zurich
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 2 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
    volumes:
      - ${BACKUP_DIR:?BACKUP_DIR fehlt in .env}:/dumps
    mem_limit: 64m

  # Updates backend, frontend and backup (only containers with the label above – not the database,
  # a new PostgreSQL is a deliberate step). Database changes the backend applies itself when it
  # starts (Flyway). The maintained fork of Watchtower – the original (containrrr) is archived.
  watchtower:
    image: nickfedor/watchtower:1.23.0
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: Europe/Zurich
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_SCHEDULE: ${UPDATE_SCHEDULE:-0 */5 * * * *}
      # old images are deleted – the NAS disk does not fill up; going back pulls the version again
      WATCHTOWER_CLEANUP: "true"
    mem_limit: 64m

volumes:
  db-data:
